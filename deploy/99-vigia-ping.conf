# Destino: /etc/sysctl.d/99-vigia-ping.conf en el LXC.
# En un LXC sin privilegios, Debian deja ping_group_range en "65534 65534":
# el usuario vigia no puede abrir sockets ICMP y PingCheck falla con exit 2.
# Se amplia al rango completo de GIDs mapeados del contenedor (65536).
net.ipv4.ping_group_range = 0 65535
